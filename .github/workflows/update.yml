name: Обновление архива публикаций

# Триггеры:
#   - по расписанию (ежедневно в 6:00 UTC)
#   - вручную через кнопку "Run workflow"
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Права на запись в репозиторий (для git push обновлённого index.html)
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем репозиторий
      - name: Проверка репозитория (checkout)
        uses: actions/checkout@v4

      # 2. Устанавливаем Python (зависимости не нужны — стандартная библиотека)
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Запускаем парсер — генерирует свежий index.html
      - name: Запуск парсера
        run: python parser.py

      # 4. Проверяем, изменился ли index.html
      #    Если файл не изменился — workflow завершается без коммита (идемпотентность)
      - name: Проверка изменений
        id: check_changes
        run: |
          if git diff --exit-code index.html; then
            echo "Изменений нет — коммит не требуется."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "index.html изменился — будет создан коммит."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 5. Если изменения есть — коммитим и пушим
      - name: Коммит и push обновлённого архива
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Обновление архива публикаций (автоматически)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
